<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e38"/>
      <stop offset="50%" stop-color="#141428"/>
      <stop offset="100%" stop-color="#0c0d18"/>
    </linearGradient>
    <linearGradient id="bar1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="bar2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="bar3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#1e1b4b" stop-opacity="0.4"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#6366f1" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect x="32" y="32" width="448" height="448" rx="100" fill="url(#bgGrad)" filter="url(#shadow)"/>
  <rect x="33" y="33" width="446" height="446" rx="99" fill="none" stroke="url(#borderGrad)" stroke-width="2"/>

  <!-- Timeline Grid Lines -->
  <line x1="160" y1="90" x2="160" y2="422" stroke="#ffffff" stroke-opacity="0.07" stroke-width="2" stroke-dasharray="4 4"/>
  <line x1="256" y1="90" x2="256" y2="422" stroke="#ffffff" stroke-opacity="0.1" stroke-width="2"/>
  <line x1="352" y1="90" x2="352" y2="422" stroke="#ffffff" stroke-opacity="0.07" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- Track 1: Blue/Indigo Bar -->
  <g filter="url(#glow)">
    <rect x="110" y="145" width="230" height="52" rx="18" fill="url(#bar1)"/>
    <rect x="110" y="145" width="150" height="52" rx="18" fill="#4338ca" fill-opacity="0.35"/>
    <circle cx="136" cy="171" r="9" fill="#ffffff" fill-opacity="0.9"/>
    <!-- Milestone diamond attached -->
    <polygon points="380,171 392,159 404,171 392,183" fill="#38bdf8"/>
    <line x1="340" y1="171" x2="380" y2="171" stroke="#38bdf8" stroke-width="3" stroke-dasharray="4 3" stroke-opacity="0.8"/>
  </g>

  <!-- Track 2: Green Emerald Bar -->
  <g>
    <rect x="170" y="230" width="220" height="52" rx="18" fill="url(#bar2)"/>
    <rect x="170" y="230" width="160" height="52" rx="18" fill="#047857" fill-opacity="0.35"/>
    <circle cx="196" cy="256" r="9" fill="#ffffff" fill-opacity="0.9"/>
  </g>

  <!-- Track 3: Amber Bar -->
  <g>
    <rect x="120" y="315" width="200" height="52" rx="18" fill="url(#bar3)"/>
    <rect x="120" y="315" width="80" height="52" rx="18" fill="#b45309" fill-opacity="0.35"/>
    <circle cx="146" cy="341" r="9" fill="#ffffff" fill-opacity="0.9"/>
    <!-- Milestone star attached -->
    <polygon points="360,341 366,325 373,338 387,338 376,347 380,361 369,352 358,361 362,347 351,338 365,338" fill="#f43f5e"/>
    <line x1="320" y1="341" x2="355" y2="341" stroke="#f43f5e" stroke-width="3" stroke-dasharray="4 3" stroke-opacity="0.8"/>
  </g>

  <!-- Today Line Marker -->
  <line x1="256" y1="110" x2="256" y2="400" stroke="#f43f5e" stroke-width="3.5"/>
  <circle cx="256" cy="110" r="7" fill="#f43f5e"/>
</svg>
