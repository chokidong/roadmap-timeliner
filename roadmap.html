function hasDesktopUnsavedChanges(){
  if(!S)return false;
  if(desktopPath){
    return desktopSavedSnapshot!==snapshotForDesktop();
  }
  return desktopSavedSnapshot!==null?desktopSavedSnapshot!==snapshotForDesktop():true;
}
async function confirmDiscardDesktopChanges(){
  if(!hasDesktopUnsavedChanges())return true;
  if(window.roadmapDesktop?.confirmDiscard){
    return await window.roadmapDesktop.confirmDiscard();
  }
  return confirm(lang==='ko'?'저장하지 않은 변경사항을 버리시겠습니까?':'Discard unsaved changes?');
}
function applyLoadedDocument(p,sourcePath=null){
  const v=validate(p);
  if(!v.valid){toast(t('importErr')+': '+v.errors.map(x=>x.code).join(', '),'err');return false;}
  const themePreset=typeof p.roadmap?.theme==='string'?p.roadmap.theme:p.roadmap?.theme?.preset;
  if(themePreset&&THEME_PALETTES[themePreset])applyThemePreset(p.roadmap,themePreset);
  if(p.roadmap?.locale){lang=p.roadmap.locale;const ls=document.getElementById('langSel');if(ls)ls.value=lang;applyI18n();}
  if(p.roadmap?.scale){tlScale=p.roadmap.scale;syncScaleButtons();}
  S=p;hist=[clone(S)];histIdx=0;desktopPath=sourcePath;desktopSavedSnapshot=null;saveState();render();desktopSavedSnapshot=sourcePath?snapshotForDesktop():null;toast(t('importOk'),'ok');
  return true;
}
document.getElementById('fileIn').addEventListener('change',e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=ev=>{
    try{
      applyLoadedDocument(JSON.parse(ev.target.result));
    }catch{toast(t('importErr'),'err');}
  };
  r.readAsText(f);e.target.value='';
});

async function doDesktopOpen(){
  if(!window.roadmapDesktop)return;
  if(!await confirmDiscardDesktopChanges())return;
  try{
    const result=await window.roadmapDesktop.open();
    if(result?.cancelled)return;
    const parsed=JSON.parse(result.text);
    if(applyLoadedDocument(parsed,result.path)){
      window.roadmapDesktop.rememberRecent?.(result.path);
    }
  }catch(err){
    console.error('Open error:',err);
    toast(t('importErr'),'err');
  }
}

async function doDesktopSave(saveAs=false){
  if(!window.roadmapDesktop)return false;
  if(!S){
    toast(lang==='ko'?'저장할 로드맵이 없습니다. 먼저 문서를 생성하세요.':'No roadmap to save. Create a document first.','err');
    return false;
  }
  const curTitle=document.getElementById('rmTitle')?.value?.trim();
  if(curTitle)S.roadmap.title=curTitle;
  S.roadmap.locale=lang;S.roadmap.scale=tlScale;
  try{
    const text=snapshotForDesktop();
    const targetPath=saveAs?null:desktopPath;
    const result=await window.roadmapDesktop.save(text+'\n',targetPath);
    if(result?.cancelled)return false;
    desktopPath=result.path;desktopSavedSnapshot=text;window.roadmapDesktop.rememberRecent?.(result.path);saveState();toast(t('exportOk'),'ok');return true;
  }catch(err){
    console.error('Save error:',err);
    toast(lang==='ko'?'저장 실패':'Save failed','err');
    return false;
  }
}

async function doDesktopNew(){
  if(!await confirmDiscardDesktopChanges())return;
  S=null;hist=[];histIdx=-1;desktopPath=null;desktopSavedSnapshot=null;
  try{
    localStorage.setItem(getStoreKey(),'__RESET__');
  }catch(e){}
  onboardStep=0;selectedTemplate=null;render();
  toast(lang==='ko'?'새 로드맵 만들기를 시작합니다':'Started new roadmap','ok');
}

async function doDesktopReload(){
  if(!window.roadmapDesktop||!desktopPath)return;
  if(!await confirmDiscardDesktopChanges())return;
  try{
    const result=await window.roadmapDesktop.reload(desktopPath);
    applyLoadedDocument(JSON.parse(result.text),result.path);
  }catch{toast(t('importErr'),'err');}
}

function safeName(){
  return (S?.roadmap.title||'roadmap').trim().replace(/[/\\?%*:|"<>]/g,'_').replace(/\s+/g,'_')||'roadmap';
}

function doExportJSON(){
  const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=safeName()+'.json';a.click();URL.revokeObjectURL(url);toast(t('exportOk'),'ok');
}

function generateCleanExportHTML(data){
  const exportData=clone(data);
  const curTitle=document.getElementById('rmTitle')?.value?.trim();
  if(curTitle) exportData.roadmap.title=curTitle;
  const curSub=document.getElementById('rmSubtitle')?.value?.trim();
  if(curSub!==undefined) exportData.roadmap.subtitle=curSub;
  exportData.roadmap.locale=lang;
  exportData.roadmap.scale=tlScale;

  const cloneDoc=document.documentElement.cloneNode(true);

  // 1. Remove export overlay, toasts, and open dropdowns
  cloneDoc.querySelectorAll('.exp-ov').forEach(el=>el.remove());
  const toastZ=cloneDoc.querySelector('#toastZone');
  if(toastZ) toastZ.innerHTML='';
  const moreDd=cloneDoc.querySelector('#moreDd');
  if(moreDd) moreDd.classList.remove('open');
  const ctx=cloneDoc.querySelector('#ctxMenu');
  if(ctx) ctx.classList.remove('open');
  const overlay=cloneDoc.querySelector('#overlay');
  if(overlay) overlay.classList.remove('open');

  // 2. Remove any previous embedded data scripts
  cloneDoc.querySelectorAll('#__ROADMAP_EMBEDDED_DATA__').forEach(el=>el.remove());

  // 3. Clear dynamic containers so on opening the file, init() cleanly renders with fresh listeners
  const appContent=cloneDoc.querySelector('#appContent');
  if(appContent) appContent.innerHTML='';
  const headerLegend=cloneDoc.querySelector('#headerLegend');
  if(headerLegend) headerLegend.innerHTML='';

  // 4. Update title and subtitle in input and <title> tag
  const safeTitle=exportData.roadmap.title||'Roadmap';
  const titleInp=cloneDoc.querySelector('#rmTitle');
  if(titleInp) titleInp.setAttribute('value',safeTitle);
  const subInp=cloneDoc.querySelector('#rmSubtitle');
  if(subInp){
    if(exportData.roadmap.subtitle){
      subInp.setAttribute('value',exportData.roadmap.subtitle);
      subInp.style.display='block';
    }else{
      subInp.removeAttribute('value');
      subInp.style.display='none';
    }
  }
  const titleTag=cloneDoc.querySelector('title');
  if(titleTag) titleTag.textContent=safeTitle+' - Roadmap Timeliner';

  // 5. Update language in <html lang> and <select id="langSel">
  cloneDoc.setAttribute('lang',lang);
  const langSel=cloneDoc.querySelector('#langSel');
  if(langSel){
    langSel.querySelectorAll('option').forEach(opt=>{
      if(opt.value===lang) opt.setAttribute('selected','');
      else opt.removeAttribute('selected');
    });
  }

  // 6. Update scale buttons
  cloneDoc.querySelectorAll('#scaleGroup [data-sc]').forEach(b=>{
    if(b.dataset.sc===(tlScale||'auto')) b.classList.add('active');
    else b.classList.remove('active');
  });

  // 7. Inject safe JSON data script tag in <head>
  const scriptEl=document.createElement('script');
  scriptEl.id='__ROADMAP_EMBEDDED_DATA__';
  scriptEl.type='application/json';
  scriptEl.textContent=JSON.stringify(exportData).replace(/</g,'\\u003c');
  const head=cloneDoc.querySelector('head');
  if(head) head.appendChild(scriptEl);

  return '<!DOCTYPE html>\n'+cloneDoc.outerHTML;
}

async function doExportHTML(){
  if(!S) return;
  const curTitle=document.getElementById('rmTitle')?.value?.trim();
  if(curTitle) S.roadmap.title=curTitle;
  const curSub=document.getElementById('rmSubtitle')?.value?.trim();
  if(curSub!==undefined) S.roadmap.subtitle=curSub;
  S.roadmap.locale=lang;
  S.roadmap.scale=tlScale;

  try{
    const html=generateCleanExportHTML(S);
    if(window.roadmapDesktop?.exportHtml){
      const result=await window.roadmapDesktop.exportHtml(html, safeName()+'.html');
      if(result?.cancelled)return;
      toast(t('exportOk'),'ok');
      return;
    }
    const blob=new Blob([html],{type:'text/html;charset=utf-8'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;
    a.download=safeName()+'.html';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    toast(t('exportOk'),'ok');
  }catch(err){
    console.error(err);
    toast(lang==='ko'?'HTML 내보내기 실패':'HTML export failed','err');
  }
}

function generateStaticHTMLFragment(){
  const canvas=document.querySelector('.roadmap-canvas');
  if(!canvas)return '';
  const sheet=document.createElement('div');
  sheet.className='export-sheet roadmap-html-export';
  const heading=document.createElement('div');heading.className='export-heading';
  const title=document.createElement('h1');title.textContent=S.roadmap.title||'Roadmap';heading.appendChild(title);
  if(S.roadmap.subtitle){const sub=document.createElement('p');sub.textContent=S.roadmap.subtitle;heading.appendChild(sub);}
  const legendEl=document.getElementById('headerLegend');
  if(legendEl&&legendEl.firstElementChild){heading.appendChild(legendEl.firstElementChild.cloneNode(true));}
  const staticCanvas=canvas.cloneNode(true);
  staticCanvas.querySelectorAll('button,.rzh').forEach(el=>el.remove());
  staticCanvas.querySelectorAll('*').forEach(el=>{
    ['onclick','oncontextmenu','onmousedown'].forEach(name=>el.removeAttribute(name));
    if(el.tagName==='A'){el.setAttribute('rel','noopener noreferrer');}
  });
  sheet.append(heading,staticCanvas);
  const css=Array.from(document.querySelectorAll('style')).map(el=>el.textContent||'').join('\n');
  return `<style>\n${css}\n</style>\n${sheet.outerHTML}`;
}

async function copyText(text){
  if(navigator.clipboard?.writeText){await navigator.clipboard.writeText(text);return;}
  const area=document.createElement('textarea');
  area.value=text;area.setAttribute('readonly','');
  area.style.cssText='position:fixed;left:-9999px;top:0;';
  document.body.appendChild(area);area.select();
  const copied=document.execCommand('copy');area.remove();
  if(!copied)throw new Error('Clipboard unavailable');
}

async function doCopyHTML(){
  if(!S)return;
  const html=generateStaticHTMLFragment();
  if(!html)return;
  try{await copyText(html);toast(t('copyOk'),'ok');}
  catch(err){toast(lang==='ko'?'HTML 복사 실패':'HTML copy failed','err');}
}

async function doExportPNG(){
  const canvas=document.querySelector('.roadmap-canvas');
  if(!canvas)return;
  const ov=document.createElement('div');ov.className='exp-ov';ov.innerHTML='<div class="exp-spin"></div><p>Generating PNG…</p>';document.body.appendChild(ov);
  const sheet=document.createElement('div');
  sheet.className='export-sheet';
  sheet.style.cssText=`position:absolute;left:-100000px;top:0;width:${canvas.offsetWidth+80}px;`;
  const heading=document.createElement('div');heading.className='export-heading';
  const title=document.createElement('h1');title.textContent=S.roadmap.title||'Roadmap';heading.appendChild(title);
  if(S.roadmap.subtitle){const sub=document.createElement('p');sub.textContent=S.roadmap.subtitle;heading.appendChild(sub);}
  const legendEl=document.getElementById('headerLegend');
  if(legendEl&&legendEl.firstElementChild){heading.appendChild(legendEl.firstElementChild.cloneNode(true));}
  sheet.append(heading,canvas.cloneNode(true));document.body.appendChild(sheet);
  try{
    if(typeof html2canvas==='undefined')throw new Error('html2canvas not available');
    await document.fonts.ready;
    const cv=await html2canvas(sheet,{backgroundColor:'#ffffff',scale:2,useCORS:true,logging:false,windowWidth:sheet.offsetWidth+80});
    const a=document.createElement('a');a.href=cv.toDataURL('image/png');a.download=safeName()+'.png';a.click();toast(t('exportOk'),'ok');
  }catch(err){toast('PNG error: '+err.message,'err');}
  finally{sheet.remove();ov.remove();}
}

function syncColor(colId,txtId){
  const c=document.getElementById(colId),x=document.getElementById(txtId);
  if(!c||!x)return;
  c.oninput=e=>x.value=e.target.value;
  x.oninput=e=>{if(/^#[0-9A-Fa-f]{6}$/.test(e.target.value))c.value=e.target.value;};
}

document.getElementById('btnUndo').onclick=undo;
document.getElementById('btnRedo').onclick=redo;
document.getElementById('langSel').onchange=e=>{
  lang=e.target.value;if(S)S.roadmap.locale=lang;saveState();applyI18n();render();
};
document.getElementById('rmSubtitle').oninput=e=>{
  if(S)S.roadmap.subtitle=e.target.value;
};
document.getElementById('rmSubtitle').onchange=e=>{
  if(S){S.roadmap.subtitle=e.target.value.trim();pushHist();}
};
document.getElementById('rmTitle').oninput=e=>{
  if(S) S.roadmap.title=e.target.value;
};
document.getElementById('rmTitle').onchange=e=>{
  if(S){S.roadmap.title=e.target.value.trim()||'Untitled';pushHist();}
};
document.getElementById('darkModeBtn').onclick=()=>{
  if(!S)return;
  S.roadmap.darkMode=!S.roadmap.darkMode;

document.getElementById('searchInput').oninput=e=>{searchQ=e.target.value.trim();if(S)render();};
document.getElementById('scaleGroup').addEventListener('click',e=>{
  const b=e.target.closest('[data-sc]');if(!b)return;
  tlScale=b.dataset.sc;
  syncScaleButtons();
  if(S){
    S.roadmap.scale=tlScale;
    pushHist();
  }
});
let autoResizeTimer;
window.addEventListener('resize',()=>{
  if(tlScale!=='auto'||!S)return;
  clearTimeout(autoResizeTimer);
  autoResizeTimer=setTimeout(()=>render(),120);
});

document.addEventListener('keydown',e=>{
  const meta=e.ctrlKey||e.metaKey;
  if(meta&&e.key.toLowerCase()==='s'&&window.roadmapDesktop){e.preventDefault();doDesktopSave();return;}
  if(meta&&e.key==='z'&&!e.shiftKey){e.preventDefault();undo();}
  if(meta&&(e.key==='y'||(e.key==='z'&&e.shiftKey))){e.preventDefault();redo();}
  if(e.key==='Escape')closeModal();
});

/* ─────────────────────────────────────
   INIT
───────────────────────────────────── */
(function init(){
  loadState();
  if(S?.roadmap?.locale){lang=S.roadmap.locale;}
  const ls=document.getElementById('langSel');
  if(ls) ls.value=lang;
  if(S?.roadmap?.scale){tlScale=S.roadmap.scale;}
  syncScaleButtons();
  applyI18n();syncUR();render();
  desktopSavedSnapshot=snapshotForDesktop();
  if(window.roadmapDesktop){
    window.roadmapDesktop.onOpenRequest(()=>doDesktopOpen());
    window.roadmapDesktop.onSaveRequest(()=>doDesktopSave());
    window.roadmapDesktop.onSaveAsRequest(()=>doDesktopSave(true));
    window.roadmapDesktop.onReloadRequest(()=>doDesktopReload());
    window.roadmapDesktop.onNewRequest(()=>doDesktopNew());
    window.roadmapDesktop.onExportHtmlRequest?.(()=>doExportHTML());
  }
  window.roadmapDesktopActions={
    new:()=>doDesktopNew(),open:()=>doDesktopOpen(),save:()=>doDesktopSave(),saveAs:()=>doDesktopSave(true),reload:()=>doDesktopReload(),exportHtml:()=>doExportHTML(),
    load:async payload=>payload.force?applyLoadedDocument(JSON.parse(payload.text),payload.path):(await confirmDiscardDesktopChanges())&&applyLoadedDocument(JSON.parse(payload.text),payload.path),hasUnsavedChanges:()=>hasDesktopUnsavedChanges()
  };
})();
